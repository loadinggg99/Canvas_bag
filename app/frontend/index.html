<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price_pilot_v1 · 波司登拼多多价格分析</title>
    <link rel="stylesheet" href="/css/style.css?v=20261030-4">
</head>
<body>
    <header class="topbar">
        <h1>Price_pilot_v1</h1>
        <p class="subtitle">波司登拼多多价格分析原型</p>
    </header>

    <nav class="tabs">
        <button class="tab active" data-tab="import">导入数据</button>
        <button class="tab" data-tab="products">商品列表</button>
        <button class="tab" data-tab="analytics">利润分析</button>
        <button class="tab" data-tab="simulation">定价模拟</button>
    </nav>

    <main>
        <!-- 导入数据 -->
        <section id="tab-import" class="panel active">
            <h2>导入价格表</h2>
            <p class="hint">从 data/raw 目录选择一个文件导入（全量替换）。</p>
            <div class="row">
                <select id="file-select" aria-label="选择文件"></select>
                <button id="btn-import" class="btn primary">开始导入</button>
            </div>
            <div id="import-result" class="import-result" hidden></div>
        </section>

        <!-- 商品列表 -->
        <section id="tab-products" class="panel">
            <h2>商品列表</h2>
            <div class="row">
                <input id="product-search" type="text" placeholder="按货号搜索，如 B20112320">
                <button id="btn-search" class="btn">搜索</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>货号</th><th>吊牌价</th><th>二级结算价</th><th>费用</th>
                            <th>拼多多售价</th><th>PDD毛利</th><th>代理结算价</th>
                            <th>代理折扣</th><th>代理利润</th><th>自己利润</th>
                        </tr>
                    </thead>
                    <tbody id="product-tbody">
                        <tr><td colspan="10" class="empty">加载中……</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pager">
                <button id="btn-prev" class="btn">上一页</button>
                <span id="page-info"></span>
                <button id="btn-next" class="btn">下一页</button>
            </div>
        </section>

        <!-- 利润分析 -->
        <section id="tab-analytics" class="panel">
            <h2>利润分析</h2>
            <div class="row">
                <button id="btn-analytics" class="btn primary">分析</button>
                <span id="analytics-status" class="hint" role="status"></span>
            </div>
            <div id="analytics-summary" class="cards"></div>

            <div id="analytics-ai" class="ai-card" hidden>
                <div class="ai-card-head">
                    <h3>AI 利润分析</h3>
                    <span id="analytics-ai-tools" class="hint"></span>
                </div>
                <div id="analytics-ai-content" class="ai-content"></div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>货号</th><th>拼多多售价</th><th>PDD毛利</th>
                            <th>毛利率</th><th>异常</th>
                        </tr>
                    </thead>
                    <tbody id="analytics-tbody">
                        <tr><td colspan="5" class="empty">点击“分析”查看结果</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 定价模拟 -->
        <section id="tab-simulation" class="panel">
            <h2>定价模拟</h2>
            <p class="hint">输入货号和想模拟的新售价，看毛利、毛利率如何变化。</p>
            <div class="form-grid">
                <label>货号
                    <input id="sim-code" type="text" placeholder="如 B20112320">
                </label>
                <label>新售价（元）
                    <input id="sim-price" type="number" step="0.01" min="0" placeholder="如 1100">
                </label>
                <label>目标毛利率（可选，0~1）
                    <input id="sim-margin" type="number" step="0.01" min="0" max="1" placeholder="如 0.5">
                </label>
                <label>最低售价（可选）
                    <input id="sim-min" type="number" step="0.01" min="0" placeholder="可留空">
                </label>
                <label>最高售价（可选）
                    <input id="sim-max" type="number" step="0.01" min="0" placeholder="可留空">
                </label>
            </div>
            <button id="btn-simulate" class="btn primary">模拟</button>
            <div id="simulation-result" hidden></div>
        </section>
    </main>

    <!-- AI 对话侧边栏 -->
    <button id="chat-toggle" class="chat-toggle" type="button"
            aria-label="打开 AI 对话" aria-controls="chat-sidebar" aria-expanded="false">
        AI 对话
    </button>

    <div id="chat-backdrop" class="chat-backdrop" hidden></div>

    <aside id="chat-sidebar" class="chat-sidebar" aria-hidden="true" aria-label="AI 对话">
        <div class="chat-header">
            <div>
                <h2>AI 助手</h2>
                <p class="hint">查商品、看利润、模拟调价、检查风险</p>
            </div>
            <button id="chat-close" class="chat-close" type="button" aria-label="关闭对话">×</button>
        </div>

        <div id="chat-messages" class="chat-messages" aria-live="polite">
            <div class="chat-message assistant">
                <div class="chat-bubble">
                    你好，我可以帮你查询商品、分析利润、模拟调价和检查定价风险。
                    试试问：“查询 B20112320 的毛利率”。
                </div>
            </div>
        </div>

        <form id="chat-form" class="chat-form">
            <textarea id="chat-input" rows="2" maxlength="4000"
                      placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
            <button id="chat-send" class="btn primary" type="submit">发送</button>
        </form>
    </aside>

    <script src="/js/app.js?v=20261030-4"></script>
</body>
</html>
