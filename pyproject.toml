[project]
name = "Price_pilot_v1"
version = "0.1.0"
description = "波司登拼多多价格导入、利润分析与定价模拟"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "langchain-openai>=1.7.1",
    "langchain>=1.4.7",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymysql>=1.2.3",
    "sqlalchemy>=2.1.6",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
